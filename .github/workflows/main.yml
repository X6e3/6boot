name: format-check

# Checks only the lines a push or pull request adds or edits, and only in the
# files 6boot owns. The inherited m1n1 sources keep their own formatting.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  format-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install clang-format-20
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-format-20

      - name: Check changed lines in 6boot's own files
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base=$PR_BASE ;;
            push) base=$BEFORE ;;
            *) base= ;;
          esac
          # A new branch, a force push or a manual run has no usable base:
          # check the last commit.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=HEAD^
          fi
          bash .github/format-changed.sh "$base" clang-format-20
